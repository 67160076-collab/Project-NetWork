server {
    server_name papayapogpog.duckdns.org;
location /dashboard/ {
        alias /var/www/dashboard/;
        index index.html;
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/.htpasswd_dashboard;
        limit_req zone=dashlogin burst=10 nodelay;
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex, nofollow";
    }
root /var/www/papaya;
    index index.php;
    location / { try_files $uri $uri/ /index.php?$args; }
    server_tokens off;
    location ~* ^/wp-content/uploads/.*[.]php$ { deny all; }
    location = /xmlrpc.php { deny all; }
    location ~ [.]php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
    }
    location ~ /[.]ht { deny all; }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/papayapogpog.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/papayapogpog.duckdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = papayapogpog.duckdns.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name papayapogpog.duckdns.org;
    return 404; # managed by Certbot


}